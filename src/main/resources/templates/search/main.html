<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>장소 검색</title>
    <link rel="stylesheet" href="/assets/styles/common.css">
    <link rel="stylesheet" href="/search/assets/styles/main.css">
    <script th:src="@{'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoMapKey}}"></script>
    <script src="/assets/scripts/common.js" defer></script>
    <script src="/search/assets/scripts/main.js" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/common.html :: topNavigator}"></th:block>

<div class="content">
    <div class="sub-menu">
        <div class="item">탐색</div>
        <div class="item">문화/행사</div>
    </div>

    <div class="tab-content" id="tab-search">
        <section class="place-search">
            <div class="title">놀러 갈 장소를 검색해 보세요!</div>
            <div class="place">
                <div class="search-section">
                    <div class="search"></div>

                    <div class="recommend">
                        <div class="txt">이번 지역은 대구 어떤가요?</div>
                        <div class="item">
                            <img src="" alt="">
                            <div class="store-name">아눅카페 만촌점</div>
                            <div class="review"></div>
                        </div>
                    </div>

                    <div class="store-info">
                        <img src="" alt="">
                        <div class="top-info">
                            <div class="main-info">
                                <div class="store-name">아눅카페 만촌점</div>
                                <div class="review"></div>
                            </div>
                            <div class="action">
                                <div class="heart"></div>
                                <div class="share"></div>
                            </div>
                        </div>
                        <div class="detail-info">
                            <div class="menu">
                                <div class="item">장소정보</div>
                                <div class="item">리뷰</div>
                            </div>
                            <div class="place-info">
                                <div class="address">주소</div>
                                <div class="time">0시</div>
                                <div class="call">전화번호</div>
                            </div>
                            <div class="place-review">
                                <div class="item">
                                    <div class="user-review">
                                        <div class="profile"></div>
                                        <div class="review-content"></div>
                                    </div>
                                    <img src="" alt="">
                                </div>
                            </div>
                            <div class="save-btn">+ 내 여행에 저장</div>
                        </div>

                    </div>

                </div>

                <div class="map-section">
                    <div class="filter">
                        <button></button>
                        <div class="item">축제</div>
                        <div class="item">축제</div>
                        <div class="item">축제</div>
                        <div class="item">축제</div>
                        <div class="item">축제</div>
                        <div class="item">축제</div>
                        <button></button>
                    </div>
                    <div class="map"></div>
                </div>
            </div>
        </section>

        <section class="top-place">
            <div class="title">요즘 많이 담는 장소 TOP 100</div>
        </section>

        <section class="ai-recommend">
            <div class="title">AI 추천 일정</div>
        </section>

        <section class="culture">
            <div class="title">여행에 특별함을 더할 문화/행사</div>
        </section>

        <section class="my-place">
            <div class="title">마음에 담아둔 나만의 장소</div>
        </section>
    </div>

    <div class="tab-content" id="tab-culture">
    </div>
</div>

<th:block th:replace="~{fragments/footer.html :: footer}"></th:block>
</body>
</html>
